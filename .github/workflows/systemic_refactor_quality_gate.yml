name: Systemic Refactor Quality Gate
on:
    pull_request: {}
    push:
        branches: [develop, master]
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
permissions: {}
jobs:
    quality_gate:
        name: Refactor Gate
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
            - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
              with:
                  cache: "pnpm"
                  node-version-file: package.json

            - name: Install Deps
              run: pnpm install

            - name: Large file change guard
              env:
                  GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
                  GITHUB_SHA: ${{ github.sha }}
                  LARGE_FILE_THRESHOLD: "1500"
              run: pnpm quality:large-file-check

            - name: Lint and Typecheck
              run: pnpm lint

            - name: Entrypoint contract gates
              run: pnpm quality:contracts

            # check-contract-provenance.mjs 是
            # docs/api-contract/governance/LEDGER_REVIEW_CHECKLIST.md §6
            # 「Changelog and provenance」的自动执行器，但此前全仓零引用 ——
            # 已文档化的 PR 策略实际没有任何东西在执行它。
            # 行为：仅当本 PR 相对 base 改动过 docs/api-contract/generated/ 时才校验
            # PR body 是否带 provenance 块；push 事件无 PR body 时自动 skip（exit 0）。
            - name: Contract mirror provenance guard (PR only, self-skipping)
              env:
                  GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
              run: pnpm quality:contract-provenance

            # 18 个 check-*-granular-coverage 门禁此前从未被任何 workflow 调用
            # （"看起来有门禁、实际从不执行"）。统一入口按 package.json 自动发现，
            # 新增 granular 门禁无需再改 workflow。
            - name: Granular module coverage gates
              run: pnpm quality:granular-coverage

            - name: MSC change detection (non-strict)
              run: node scripts/quality/check-msc-changes.mjs

            - name: Swallow fallback guard (strict mode)
              run: node scripts/quality/check-swallow-fallbacks.mjs --strict-baseline

            # P3 豁免到期守卫。此前两步都跑的是**非 strict** 模式 ⇒ 到期只 warn、从不阻断；
            # 2026-10-08 起改 strict，并把范围从 path-contract 一本扩到
            # swallow-fallback-baseline.json（它的 @swallow-error 白名单也有 expires，
            # 但此前没有任何东西读它）。
            - name: P3 waiver expiry guard (strict, multi-ledger)
              run: pnpm quality:waiver-expiry:strict

            - name: Sensitive log scan (warning only)
              run: pnpm quality:log-sensitive

            - name: Unit + integration tests with coverage
              run: pnpm test --coverage

            # Per-module ratchet floors live in scripts/quality/critical-modules.json
            # (target 90%). Do NOT set CRITICAL_COVERAGE_THRESHOLD here: forcing a flat
            # 90% would pin six modules permanently red and hide the ratchet.
            - name: Critical modules coverage (ratchet floors, target 90%)
              run: pnpm quality:coverage:critical

            # P2-c 是「双轨」覆盖率：关键模块 ≥85% + 全仓 ≥65%（阈值见
            # scripts/quality/coverage-targets.json）。此前只接了「关键模块」一轨，
            # quality:coverage:repo 从未被任何 workflow 调用（孤岛）⇒ 全仓那一轨形同不存在。
            # 2026-10-05 实测全仓 lines 81.49% / branches 73.24% / functions 79.84%，
            # 均高于 floor，故接线后不会常红。lcov 由上面的 `pnpm test --coverage` 产出。
            - name: "Repo-wide coverage (dual-track: full repo floors)"
              run: pnpm quality:coverage:repo

            # Surfaces untested source files that carry HTTP calls. Advisory only:
            # it prints the top-N risk files (stdout only — no markdown artifact),
            # so a regression shows up in the job log without blocking unrelated PRs.
            # The blocking counterpart is `pnpm quality:coverage:critical-files` (in lint)
            # plus the granular gates above.
            - name: Weak coverage report (advisory, non-blocking)
              run: pnpm quality:coverage:weak-files

            # 模块级版本：与上面文件级同源（find-lowest-coverage-modules.mjs / -files.mjs
            # 曾共享同一个 bug，说明两者本就该成对维护）。此前只有文件级进了 CI，
            # 模块级这个 npm script 没有任何 workflow 调用 ⇒ 被可达性门禁判为死门禁。
            - name: Weak coverage report - modules (advisory, non-blocking)
              run: pnpm quality:coverage:weak-modules

            - name: High severity audit gate
              run: pnpm audit:high

            - name: Performance guard
              run: pnpm perf:ci
