sonar.projectKey=matrix-js-sdk
sonar.organization=matrix-org

sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=spec
sonar.exclusions=docs,examples,git-hooks

sonar.typescript.tsconfigPath=./tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=spec/**/*
sonar.testExecutionReportPaths=coverage/sonar-report.xml

sonar.lang.patterns.ts=**/*.ts,**/*.tsx

# Quality Gate Configuration
# Coverage threshold for new code
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Code coverage thresholds
sonar.coverage.minimum=80

# Duplicated lines threshold
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts

# Exclude generated files
sonar.exclusions=**/lib/**,**/node_modules/**,**/*.d.ts

# Issue thresholds
sonar.issue.ignore.multicriteria=e1,e2,e3

# Allow TODO comments in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts

# Allow console.log in scripts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3457
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/**/*

# Allow any type in test mocks
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6953
sonar.issue.ignore.multicriteria.e3.resourceKey=spec/**/*
